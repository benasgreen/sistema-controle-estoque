{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Cadastrar produto</h1>
<form method="post" class="row g-3">
<div class="col-md-8"><label class="form-label" for="name">Nome do produto</label><input class="form-control" id="name" name="name" required maxlength="120"></div>
<div class="col-md-4"><label class="form-label" for="code">Código</label><input class="form-control" id="code" name="code" required maxlength="40"></div>
<div class="col-md-4"><label class="form-label" for="price">Preço (R$)</label><input class="form-control" id="price" name="price" required inputmode="decimal" placeholder="18,90"></div>
<div class="col-md-4"><label class="form-label" for="quantity">Quantidade atual</label><input class="form-control" type="number" min="0" step="1" id="quantity" name="quantity" required></div>
<div class="col-md-4"><label class="form-label" for="minimum_stock">Estoque mínimo</label><input class="form-control" type="number" min="0" step="1" id="minimum_stock" name="minimum_stock" required></div>
<div class="col-12"><button class="btn btn-primary">Salvar produto</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}">Cancelar</a></div>
</form>
{% endblock %}
